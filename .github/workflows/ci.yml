name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Docker Compose
        run: docker compose build

      # 1. เอา --wait ออก เพื่อไม่ให้ค้างรอ Healthcheck ของ api ที่ไม่ได้เขียนไว้
      - name: Start services
        run: docker compose up -d

      - name: Show container status
        if: always()
        run: docker compose ps

      # 2. ปรับการเช็ก API: ตัด -f ออก หรือเช็ก HTTP status 200/404 เพื่อยืนยันว่า Express ตอบรับแล้ว
      - name: Wait for API to be ready
        run: |
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/tags || true)
            echo "Checking API... attempt $i/30 (HTTP Status: $STATUS)"
            if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 404 ]; then
              echo "API is up and responding!"
              exit 0
            fi
            sleep 3
          done
          echo "API did not become ready in time"
          exit 1

      # 3. ทดสอบยิง API จริงด้วย Endpoint มาตรฐานของ RealWorld App (/api/tags)
      - name: Smoke test API response
        run: |
          response=$(curl -s http://localhost:3000/api/tags)
          echo "Response: $response"
          echo "$response" | grep -q "tags" || (echo "Unexpected response" && exit 1)

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v